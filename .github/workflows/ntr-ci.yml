# NTR: build Cruise Control, scan with Trivy.
name: NTR CI

on:
  push:
    branches: ["ntr/**"]
    tags: ["ntr/**"]
  pull_request:
    branches: ["ntr/**"]
  workflow_dispatch:

concurrency:
  group: ntr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_EXIT_CODE: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (skip tests)
        run: ./gradlew --no-daemon assemble -x test

      - name: Collect jars
        run: |
          set -euo pipefail
          mkdir -p dist
          find . -path '*/build/libs/*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp -v {} dist/ \;
          ls -la dist

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: cruise-control-jars
          path: dist/
          if-no-files-found: error

  scan:
    name: Trivy scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: cruise-control-jars
          path: dist

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: dist
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ env.TRIVY_EXIT_CODE }}
          format: json
          output: trivy-cruise-control.json

      - name: Trivy table report
        if: always()
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: dist
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          format: table

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-cruise-control
          path: trivy-cruise-control.json

  publish:
    name: Publish GitHub Packages (Maven)
    needs: [build, scan]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          cat > init.gradle <<'EOF'
          allprojects {
            pluginManager.withPlugin('maven-publish') {
              publishing {
                repositories {
                  maven {
                    name = 'GitHubPackages'
                    url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
                    credentials {
                      username = System.getenv('GITHUB_ACTOR')
                      password = System.getenv('GITHUB_TOKEN')
                    }
                  }
                }
              }
            }
          }
          EOF
          ./gradlew --no-daemon -I init.gradle \
            :cruise-control:publish \
            :cruise-control-core:publish \
            :cruise-control-metrics-reporter:publish \
            -x test
